name: Deploy legal pages

on:
  push:
    branches:
      - main
    paths:
      - '**/*.html'
      - '.nojekyll'
      - '.github/workflows/main.yml'
  workflow_dispatch: # زر "Run workflow" في GitHub للتشغيل اليدوي

# سماح للنشر على GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# نشر واحد في كل مرة
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
